name: Repair dev main.ts

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-dev-main.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev with history
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Restore intact instrumented main.ts and add visible version
        run: |
          git checkout d9048b3 -- src/main.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.ts')
          s = p.read_text()
          old = '<header><p class="eyebrow">OpenEyeTrack browser demo</p>'
          new = '<header><p class="eyebrow">OpenEyeTrack browser demo · <strong>DEV v0.2.0</strong> · timing instrumentation</p>'
          if old not in s:
              raise SystemExit('Expected header marker not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit repaired file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "Repair dev main.ts and restore version header"
          git push origin HEAD:dev
