name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: SDK contract smoke test
        run: npm run test:sdk

      - name: Build distributable SDK package
        run: |
          npm run package:sdk
          npm run verify:sdk-package

      - name: Stage browser runtime assets
        run: |
          mkdir -p public
          cp -R dist-sdk/models public/
          cp -R dist-sdk/ort public/
          mkdir -p public/mediapipe
          cp -R dist-sdk/mediapipe/wasm public/mediapipe/
          test -f public/models/face_landmarker.task
          test -f public/mediapipe/wasm/vision_wasm_module_internal.js
          test -f public/mediapipe/wasm/vision_wasm_module_internal.wasm

      - name: Build
        run: npm run build
