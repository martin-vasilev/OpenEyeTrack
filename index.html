<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OpenEyeTrack browser test application" />
  <title>OpenEyeTrack</title>
  <style>
    #dev-build-badge{position:fixed;right:10px;bottom:10px;z-index:99999;padding:6px 10px;border-radius:6px;background:rgba(15,23,42,.88);color:#fff;font:12px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:none}
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="dev-build-badge" title="OpenEyeTrack development build">DEV v0.2.4 · ELG buffer reuse + crop diagnostics</div>
  <script type="module" src="/src/main.ts"></script>
  <script type="module">
    const label = document.querySelector("header .eyebrow");
    if (label) label.innerHTML = 'OpenEyeTrack browser demo · <strong>DEV v0.2.4</strong> · ELG buffer reuse + crop diagnostics';

    const settings = document.querySelector('.research-settings');
    if (settings && !document.querySelector('#record-dev-diagnostics')) {
      const heading = document.createElement('h3');
      heading.textContent = 'Developer recording';
      const toggle = document.createElement('label');
      toggle.className = 'toggle';
      toggle.innerHTML = '<input id="record-dev-diagnostics" type="checkbox" /> Record full developer diagnostics (component timings and internal timestamps)';
      const note = document.createElement('p');
      note.className = 'muted';
      note.textContent = 'Off by default. Enable for performance benchmarking; normal recordings omit internal timing columns.';
      settings.append(heading, toggle, note);
    }
  </script>
</body>
</html>
